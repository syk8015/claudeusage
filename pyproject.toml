[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudeusage"
version = "1.0.0"
description = "Measures whether your Claude subscription is paying off, from local logs. No upload."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "syk8015" }]
keywords = ["mcp", "claude", "claude-code", "anthropic", "rate-limit", "usage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# 의존성 없음. 표준 라이브러리만 쓴다 — 이게 이 도구의 설계 원칙이다.
dependencies = []

[project.urls]
Homepage = "https://github.com/syk8015/claudeusage"
Repository = "https://github.com/syk8015/claudeusage"
Issues = "https://github.com/syk8015/claudeusage/issues"

[project.scripts]
claudeusage = "claudeusage.cli:main"
claudeusage-mcp = "claudeusage.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeusage"]

[tool.hatch.build.targets.sdist]
include = ["src/claudeusage", "README.md", "README.ko.md", "LICENSE", "skills"]
