[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudeusage"
version = "1.0.0"
description = "Measures whether your Claude subscription is paying off, from local logs. No upload."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "syk8015" }]
keywords = ["mcp", "claude", "claude-code", "anthropic", "rate-limit", "usage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# 의존성 없음. 표준 라이브러리만 쓴다 — 이게 이 도구의 설계 원칙이다.
dependencies = []

[project.optional-dependencies]
# 개발용(테스트)이다. 실행에는 필요 없다 — 위의 "의존성 없음"은 그대로다.
#   pip install -e '.[dev]' && python -m pytest
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/syk8015/claudeusage"
Repository = "https://github.com/syk8015/claudeusage"
Issues = "https://github.com/syk8015/claudeusage/issues"

[project.scripts]
claudeusage = "claudeusage.cli:main"
claudeusage-mcp = "claudeusage.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]                       # 설치하지 않고 저장소에서 바로 돌린다

[tool.hatch.build.targets.wheel]
packages = ["src/claudeusage"]

[tool.hatch.build.targets.sdist]
include = ["src/claudeusage", "README.md", "README.ko.md", "LICENSE", "skills"]
